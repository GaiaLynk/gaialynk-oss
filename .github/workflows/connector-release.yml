# E-21：桌面 Connector — tag 触发构建并发布 GitHub Release。
# 触发：git tag connector-v* && git push origin connector-v*
#
# Windows：当前阶段不配置代码签名证书，产出未签名的 .msi / .exe（与 CTO 决策一致）。
# macOS：若配置了 APPLE_* / KEYCHAIN_PASSWORD 等 Secrets，由 Tauri 在构建时签名并可配合公证；
#        未配置时产出未签名安装包。
#
# 版本与 tag：请保持 packages/connector/src-tauri/tauri.conf.json 的 version、
# Cargo.toml version 与 tag 中语义化版本一致（例如 tag connector-v0.1.0 ↔ 0.1.0）。
#
# macOS：aarch64 与 x86_64 分两个 job，x86_64 needs aarch64，同一时刻只占用 1 个 macOS Runner。
# Windows 与 publish-macos-aarch64 并行。
# macOS 公证：等待时间主要取决于 Apple 侧队列/API，与 .app 体积几乎无关（notarytool 提交后轮询直至终态）。
# 已知情况：Notary 服务曾出现大面积「长时间 In Progress」、论坛有 90min+ 案例（tauri#14579、electron/notarize#179）；非「包太大上传慢」。
# 若 job 在「Notarizing …」卡到 timeout：先查日志是否出现 NSURLError / HTTP 401；可错峰 Re-run；紧急可用 tauri build --skip-stapling（不等待公证完成即结束，产物可能尚未可分发，慎用）。
# 本 workflow：mac job 含 Apple 连通性预检 + --verbose；仅使用 Apple ID 公证时勿设 APPLE_API_*（避免误配 Key ID）。

name: Connector release

on:
  push:
    tags:
      - "connector-v*"

permissions:
  contents: write

# 勿在发布中途 cancel-in-progress：重复打 tag / 误触会整单取消，易留下「部分架构已上传、另一架构 cancelled」。
concurrency:
  group: connector-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/connector/package-lock.json
      - run: npm ci --prefix packages/connector
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/connector/src-tauri -> target
          key: connector-windows-${{ github.ref_name }}
      # Tauri：无密码密钥若「完全不设置」PASSWORD 变量，会走交互读终端 → CI 报 Device not configured (os error 6)。
      # 通过 GITHUB_ENV 显式写入空字符串或 Secret 值，与本地 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""` 等价。
      - name: Export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        shell: bash
        env:
          PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${PASSWORD_SECRET}" >> "$GITHUB_ENV"
      # 若密钥只在「Environment」里而本 job 未设置 environment:，此处为空 → Tauri 报 Missing encoded key（见 tauri-action#658）。
      - name: Verify TAURI_SIGNING_PRIVATE_KEY is present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          n=${#KEY}
          echo "TAURI_SIGNING_PRIVATE_KEY length (chars): $n"
          if [ "$n" -lt 80 ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or too short. Add it under Settings → Secrets and variables → Actions → **Secrets** (repository scope). If it only exists under Environments, either add the same secret at repo level or set job.environment in this workflow."
            exit 1
          fi
      # Windows：超长 Base64 经 step env → npm → tauri 链路易出现截断/乱码，导致 Missing encoded key。写入文件后用 TAURI_SIGNING_PRIVATE_KEY_PATH（与 CLI signer 一致）。
      - name: Materialize TAURI_SIGNING_PRIVATE_KEY to file
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          f="${RUNNER_TEMP}/tauri-updater.key"
          printf '%s' "$KEY" > "$f"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$f" >> "$GITHUB_ENV"
          echo "Updater key file size (bytes): $(wc -c < "$f" | tr -d ' ')"
      # Tauri CLI ≥2.10 在生成 updater `.sig` 时读取 `TAURI_SIGNING_PRIVATE_KEY`（Base64 单行）；仅设 `TAURI_SIGNING_PRIVATE_KEY_PATH` 会报「public key found, no private key」。
      # 仍保留上一步写入文件，便于核对大小；构建进程以 Secret 直传为准（一般远小于 Windows 环境变量上限）。
      - uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: packages/connector
          tagName: ${{ github.ref_name }}
          releaseName: GaiaLynk Connector ${{ github.ref_name }}
          releaseBody: |
            桌面 Connector 构建（E-21）。

            - **Windows**：本仓库当前发布为**未签名**安装包（无 EV/OV 证书）；下载后若出现 SmartScreen 提示属预期。
            - **macOS**：若已在仓库 Secrets 配置 Apple 开发者证书与公证相关变量，则为已签名/已公证构建；否则为未签名构建。
            - **自动更新**：已启用 Tauri updater；`latest.json` 由本 workflow 上传（需配置 `TAURI_SIGNING_PRIVATE_KEY`，与 `tauri.conf.json` 内 `pubkey` 为同一密钥对）。详见 `docs/Connector-Release-Guide-v1.md`。
          generateReleaseNotes: true
          prerelease: false
          includeUpdaterJson: true
          args: ""

  publish-macos-aarch64:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/connector/package-lock.json
      - run: npm ci --prefix packages/connector
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/connector/src-tauri -> target
          key: connector-macos-aarch64-${{ github.ref_name }}
      - name: Export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        shell: bash
        env:
          PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${PASSWORD_SECRET}" >> "$GITHUB_ENV"
      - name: Verify TAURI_SIGNING_PRIVATE_KEY is present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          n=${#KEY}
          echo "TAURI_SIGNING_PRIVATE_KEY length (chars): $n"
          if [ "$n" -lt 80 ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or too short. Add it under Settings → Secrets and variables → Actions → **Secrets** (repository scope). If it only exists under Environments, either add the same secret at repo level or set job.environment in this workflow."
            exit 1
          fi
      - name: Materialize TAURI_SIGNING_PRIVATE_KEY to file
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          f="${RUNNER_TEMP}/tauri-updater.key"
          printf '%s' "$KEY" > "$f"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$f" >> "$GITHUB_ENV"
          echo "Updater key file size (bytes): $(wc -c < "$f" | tr -d ' ')"
      - name: Preflight Apple / network (notary endpoints)
        shell: bash
        run: |
          set -euo pipefail
          echo "== reachability (fail fast if runner has no route to Apple) =="
          curl -sfI --max-time 30 https://appstoreconnect.apple.com/ | head -n 1 || {
            echo "::error::Cannot reach appstoreconnect.apple.com — notarization will not work on this runner."
            exit 1
          }
          curl -sfI --max-time 30 https://appleid.apple.com/ | head -n 1 || {
            echo "::warning::appleid.apple.com HEAD failed (notary may still work); continuing."
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/connector
          tagName: ${{ github.ref_name }}
          releaseName: GaiaLynk Connector ${{ github.ref_name }}
          releaseBody: |
            桌面 Connector 构建（E-21）。

            - **Windows**：本仓库当前发布为**未签名**安装包（无 EV/OV 证书）；下载后若出现 SmartScreen 提示属预期。
            - **macOS**：若已在仓库 Secrets 配置 Apple 开发者证书与公证相关变量，则为已签名/已公证构建；否则为未签名构建。
            - **自动更新**：已启用 Tauri updater；`latest.json` 由本 workflow 上传（需配置 `TAURI_SIGNING_PRIVATE_KEY`，与 `tauri.conf.json` 内 `pubkey` 为同一密钥对）。详见 `docs/Connector-Release-Guide-v1.md`。
          generateReleaseNotes: true
          prerelease: false
          includeUpdaterJson: true
          args: "--verbose --target aarch64-apple-darwin"

  publish-macos-x86_64:
    needs: publish-macos-aarch64
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/connector/package-lock.json
      - run: npm ci --prefix packages/connector
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/connector/src-tauri -> target
          key: connector-macos-x86_64-${{ github.ref_name }}
      - name: Export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        shell: bash
        env:
          PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${PASSWORD_SECRET}" >> "$GITHUB_ENV"
      - name: Verify TAURI_SIGNING_PRIVATE_KEY is present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          n=${#KEY}
          echo "TAURI_SIGNING_PRIVATE_KEY length (chars): $n"
          if [ "$n" -lt 80 ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or too short. Add it under Settings → Secrets and variables → Actions → **Secrets** (repository scope). If it only exists under Environments, either add the same secret at repo level or set job.environment in this workflow."
            exit 1
          fi
      - name: Materialize TAURI_SIGNING_PRIVATE_KEY to file
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          f="${RUNNER_TEMP}/tauri-updater.key"
          printf '%s' "$KEY" > "$f"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$f" >> "$GITHUB_ENV"
          echo "Updater key file size (bytes): $(wc -c < "$f" | tr -d ' ')"
      - name: Preflight Apple / network (notary endpoints)
        shell: bash
        run: |
          set -euo pipefail
          echo "== reachability (fail fast if runner has no route to Apple) =="
          curl -sfI --max-time 30 https://appstoreconnect.apple.com/ | head -n 1 || {
            echo "::error::Cannot reach appstoreconnect.apple.com — notarization will not work on this runner."
            exit 1
          }
          curl -sfI --max-time 30 https://appleid.apple.com/ | head -n 1 || {
            echo "::warning::appleid.apple.com HEAD failed (notary may still work); continuing."
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/connector
          tagName: ${{ github.ref_name }}
          releaseName: GaiaLynk Connector ${{ github.ref_name }}
          releaseBody: |
            桌面 Connector 构建（E-21）。

            - **Windows**：本仓库当前发布为**未签名**安装包（无 EV/OV 证书）；下载后若出现 SmartScreen 提示属预期。
            - **macOS**：若已在仓库 Secrets 配置 Apple 开发者证书与公证相关变量，则为已签名/已公证构建；否则为未签名构建。
            - **自动更新**：已启用 Tauri updater；`latest.json` 由本 workflow 上传（需配置 `TAURI_SIGNING_PRIVATE_KEY`，与 `tauri.conf.json` 内 `pubkey` 为同一密钥对）。详见 `docs/Connector-Release-Guide-v1.md`。
          generateReleaseNotes: true
          prerelease: false
          includeUpdaterJson: true
          args: "--verbose --target x86_64-apple-darwin"
