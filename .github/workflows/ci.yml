# CI for the public OSS mirror (Connector + Shared only).
# Synced to .github/workflows/ci.yml in the public repo via public-oss-manifest.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  connector-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/connector/package-lock.json
      # Run inside packages/connector so local typescript from npm ci is used (reliable on all runners).
      - name: Install connector dependencies
        working-directory: packages/connector
        run: npm ci
      # Do not use `npx tsc`: npm may install the wrong `tsc` package instead of TypeScript's compiler.
      - name: Typecheck connector (TypeScript)
        working-directory: packages/connector
        run: npm run typecheck

  connector-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri links against WebKitGTK on Linux; without these, cargo test fails on ubuntu-latest.
      # See https://v2.tauri.app/start/prerequisites/#linux (Debian)
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test (Tauri backend)
        working-directory: packages/connector/src-tauri
        run: cargo test
